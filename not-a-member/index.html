<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Digamma</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { --shell: #f3ecdd; --ink: #234030; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --shell: #161c1f; --ink: #f3ecdd; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--shell); }
  body { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
  /* The photographs are about 370 pixels wide, so the column stays close to that and they stay sharp. */
  .photos { display: flex; flex-direction: column; gap: 14px; width: min(400px, 100%); margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 68px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
  .photos img { display: block; width: 100%; height: auto; border-radius: 12px; background: rgba(35, 64, 48, .1); }
  a { position: fixed; z-index: 1; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; display: flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--shell); box-shadow: 0 1px 8px rgba(12, 22, 17, .22); color: inherit; text-decoration: none; }
</style>
</head>
<body>
<a href="/">Back</a>
<main class="photos" id="photos"></main>
<script>
  // The photographs for the time of year: autumn from September, winter from December.
  var FILES = [["any-1.jpg", 370, 493], ["fall-1.jpg", 370, 247], ["fall-2.jpg", 376, 354], ["fall-3.jpg", 375, 278], ["fall-4.jpg", 375, 316], ["fall-5.jpg", 375, 376], ["spring-1.jpg", 370, 295], ["winter-1.jpg", 370, 370], ["winter-2.jpg", 370, 235], ["winter-3.jpg", 370, 477], ["winter-4.jpg", 370, 658], ["winter-5.jpg", 370, 277], ["winter-6.jpg", 376, 375], ["winter-7.jpg", 376, 391]];
  var m = new Date().getMonth();
  var season = m >= 8 && m <= 10 ? "fall" : (m === 11 || m <= 1) ? "winter" : m <= 3 ? "spring" : "";
  var set = FILES.filter(function (f) { return !season || f[0].indexOf(season) === 0 || f[0].indexOf("any") === 0; });
  var photos = document.getElementById("photos");
  set.forEach(function (f, i) {
    var el = new Image(f[1], f[2]);
    el.alt = "";
    if (i > 1) el.loading = "lazy";
    el.src = "photos/" + f[0];
    photos.appendChild(el);
  });
</script>
</body>
</html>
