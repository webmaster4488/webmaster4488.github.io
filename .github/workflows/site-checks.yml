name: Public site checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check entry pages and custom domain
        run: |
          test "$(tr -d '\r\n' < CNAME)" = www.44jfk.com
          test -s index.html
          test -s not-a-member/index.html
      - name: Package site preview
        run: |
          sh tools/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: public-site-preview
          path: dist
