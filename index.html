<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Digamma</title>
  <meta name="apple-mobile-web-app-title" content="Digamma">
  <meta name="description" content="44 JFK Street, Cambridge, Massachusetts.">
  <meta name="theme-color" content="#1f282c">
  <script>document.documentElement.classList.add('js')</script>

  <!-- Link previews (iMessage, WhatsApp, Slack, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://44jfk.com/">
  <meta property="og:site_name" content="Digamma">
  <meta property="og:title" content="Digamma">
  <meta property="og:description" content="Cambridge, Massachusetts">
  <meta property="og:image" content="https://44jfk.com/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Century Schoolbook (TeX Gyre Schola, GUST Font License; see fonts/LICENSE.txt) -->
  <link rel="preload" href="fonts/schola-sc.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="preload" as="image" type="image/webp" media="(orientation: landscape)"
        imagesrcset="images/door-1000.webp 1000w, images/door-1600.webp 1600w, images/door-2400.webp 2400w, images/door-3200.webp 3200w"
        imagesizes="(max-aspect-ratio: 7/5) 140vh, 100vw">
  <link rel="preload" as="image" type="image/webp" media="(orientation: portrait)"
        imagesrcset="images/door-portrait-800.webp 800w, images/door-portrait-1400.webp 1400w, images/door-portrait-2000.webp 2000w"
        imagesizes="100vw">

  <style>
    @font-face {
      font-family: "Schola";
      src: url("fonts/schola-sc.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --green: #1f282c;
      --green-deep: #161c1f;
      --gold: #d2a03d;
      --cream: #efe8d6;
      --bar-h: 72px;
    }

    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      margin: 0;
      background: var(--green-deep);
      color: var(--cream);
      font-family: "Schola", "Century Schoolbook", "Century", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- The photograph: the whole screen ---- */
    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: var(--green-deep);
    }
    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50.3% 35%;
    }
    .js .hero img {
      opacity: 0;
      transform: scale(1.04);
    }
    .js .hero img.loaded {
      opacity: 1;
      transform: none;
      transition: opacity 1.6s ease, transform 2.8s cubic-bezier(.2, .7, .2, 1);
    }

    /* a fine line at the bottom inviting a scroll */
    .cue {
      position: absolute;
      left: 50%;
      bottom: calc(clamp(18px, 4vh, 36px) + env(safe-area-inset-bottom));
      width: 1px;
      height: 48px;
      overflow: hidden;
      transform: translateX(-50%);
      transition: opacity 0.6s ease;
    }
    .cue::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      transform-origin: top;
      animation: draw 2.6s 2s cubic-bezier(.6, 0, .3, 1) infinite both;
    }
    @keyframes draw {
      0%   { transform: scaleY(0); transform-origin: top; }
      45%  { transform: scaleY(1); transform-origin: top; }
      55%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cue::after { animation: none; transform: none; opacity: 0.6; }
      .js .hero img { transform: none; }
    }

    /* ---- Bar that appears once you scroll ---- */
    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: var(--bar-h);
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(31, 40, 44, 0.72);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 12px 30px -14px rgba(0, 0, 0, 0.45);
      transform: translateY(calc(-100% - 32px));
      transition: transform 0.7s cubic-bezier(.2, .7, .2, 1);
    }
    .bar a { display: block; padding: 6px; }
    .bar img { display: block; height: 46px; width: auto; }
    @media (max-width: 600px) { :root { --bar-h: 60px; } .bar img { height: 38px; } }
    .scrolled .bar { transform: none; }
    .scrolled .cue { opacity: 0; }

    /* ---- Below the photograph ---- */
    .close {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      background: rgba(31, 40, 44, 0.72);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 -12px 30px -14px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .address {
      margin: 0;
      font-weight: 400;
      font-size: clamp(16px, 1.25vw, 19px);
      font-variant-caps: small-caps;
      font-feature-settings: "smcp", "kern", "liga";
      letter-spacing: 0.07em;
      line-height: 1.5;
    }
    .address .street { color: var(--cream); }
    .address .sep { color: var(--gold); margin: 0 0.8em; }
    .address .city { color: var(--gold); }
    @media (max-width: 600px) {
      .address { font-size: 16px; }
      .address span { display: block; }
      .address .sep { display: none; }
    }

    /* ---- Phones and tall screens ----
       The photo is landscape, so on a tall screen it can't fill the whole
       height without showing the transom above the door. Instead: crest bar
       on top, the door and its frame edge to edge, the address underneath. */
    @media (orientation: portrait) {
      body { background: var(--green); }
      main {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100svh;
        padding-top: calc(var(--bar-h) + env(safe-area-inset-top));
      }
      .bar { transform: none; }
      .hero { position: relative; height: auto; flex: none; }
      /* Full width at the photo's own proportions, but never so tall that the
         address gets pushed below the first screen (trims the door's bottom instead). */
      .hero img {
        height: min(calc(100vw * 2905 / 2072), calc(100svh - var(--bar-h) - env(safe-area-inset-top) - 80px));
        object-fit: cover;
        object-position: center top;
      }
      .cue { display: none; }
      .close {
        flex: 1;
        min-height: 80px;
        padding-top: 12px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
        background: transparent;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <header class="bar">
    <a href="#top" aria-label="Back to top">
      <picture>
        <source type="image/webp" srcset="images/crest.webp">
        <img src="images/crest.png" width="575" height="720" alt="Crest">
      </picture>
    </a>
  </header>

  <main id="top">
    <section class="hero">
      <picture>
        <!-- Phones and other tall screens: just the door and its frame -->
        <source media="(orientation: portrait)" type="image/webp"
                srcset="images/door-portrait-800.webp 800w, images/door-portrait-1400.webp 1400w, images/door-portrait-2000.webp 2000w"
                sizes="100vw">
        <source media="(orientation: portrait)"
                srcset="images/door-portrait-800.jpg 800w, images/door-portrait-1400.jpg 1400w, images/door-portrait-2000.jpg 2000w"
                sizes="100vw">
        <source type="image/webp"
                srcset="images/door-1000.webp 1000w, images/door-1600.webp 1600w, images/door-2400.webp 2400w, images/door-3200.webp 3200w"
                sizes="(max-aspect-ratio: 7/5) 140vh, 100vw">
        <img src="images/door-2400.jpg"
             srcset="images/door-1000.jpg 1000w, images/door-1600.jpg 1600w, images/door-2400.jpg 2400w, images/door-3200.jpg 3200w"
             sizes="(max-aspect-ratio: 7/5) 140vh, 100vw"
             width="4691" height="3351"
             alt="The green front door of 44 JFK Street, with a bronze knocker and brass numerals, framed by white columns.">
      </picture>
      <span class="cue" aria-hidden="true"></span>
    </section>

    <footer class="close">
      <h1 class="address">
        <span class="street">"Without these friendships—life, what cauchemar!" — T.S. Eliot '10</span><span class="sep" aria-hidden="true">·</span><span class="city">Cambridge, Massachusetts</span>
      </h1>
    </footer>
  </main>

  <script>
    // Fade the photograph in once it has loaded
    var photo = document.querySelector('.hero img');
    function show() { photo.classList.add('loaded'); }
    if (photo.complete) show(); else { photo.addEventListener('load', show); photo.addEventListener('error', show); }

    // Reveal the bar after the first bit of scrolling
    function onScroll() { document.body.classList.toggle('scrolled', window.scrollY > 16); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
