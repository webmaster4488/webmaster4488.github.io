<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Digamma</title>
  <meta name="apple-mobile-web-app-title" content="Digamma">
  <meta name="description" content="44 JFK Street, Cambridge, Massachusetts.">
  <meta name="theme-color" content="#1f282c">
  <script>document.documentElement.classList.add('js')</script>

  <!-- Link previews (iMessage, WhatsApp, Slack, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://44jfk.com/">
  <meta property="og:site_name" content="Digamma">
  <meta property="og:title" content="Digamma">
  <meta property="og:description" content="Cambridge, Massachusetts">
  <meta property="og:image" content="https://44jfk.com/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- TeX Gyre Schola, GUST Font License; see fonts/LICENSE.txt -->
  <link rel="preload" href="fonts/schola-sc.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="preload" as="image" type="image/webp" media="(orientation: landscape)"
        imagesrcset="images/door-1000.webp 1000w, images/door-1600.webp 1600w, images/door-2400.webp 2400w, images/door-3200.webp 3200w"
        imagesizes="(max-aspect-ratio: 7/5) 140vh, 100vw">
  <link rel="preload" as="image" type="image/webp" media="(orientation: portrait)"
        imagesrcset="images/doorway-1200.webp 1200w, images/doorway-1800.webp 1800w, images/doorway-2400.webp 2400w"
        imagesizes="(min-aspect-ratio: 5/7) 100vw, 72vh">

  <style>
    @font-face {
      font-family: "Schola";
      src: url("fonts/schola-sc.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {       /* the login's typeface; see fonts/OFL-instrument-sans.txt */
      font-family: "Instrument Sans";
      src: url("fonts/instrument-sans-latin-var.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    :root {
      --green: #1f282c;
      --green-deep: #161c1f;
      --gold: #d2a03d;
      --cream: #efe8d6;
      --bar-h: 62px;
      --shell: #f3ecdd;          /* the screen beyond the door; door slate in dark mode */
      --paper: #f3ecdd;
      --glass: rgba(31, 40, 44, 0.57);   /* the top and bottom bars match */
      --glass-blur: blur(18px) saturate(1.3);
      --forest: #234030;
      /* The one place the typeface is set. */
      --font: "Schola", "Century", Georgia, serif;
    }

    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      margin: 0;
      background: var(--green-deep);
      color: var(--cream);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- The photograph: the whole screen ---- */
    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: var(--green-deep);
    }
    .stage {
      position: absolute;
      inset: 0;
    }
    .photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50.4% 0%;   /* never crop the top: trim the bottom only */
    }
    .js .photo { opacity: 0; }
    .js .photo.loaded {
      opacity: 1;
      transition: opacity 1.6s ease;
    }
    /* ---- Entering: the photograph bursts out from where it was pressed and dissolves ----
       The inside waits behind it, and the card springs up as the picture clears. */
    :root { --burst: .7s cubic-bezier(.32, .72, 0, 1); --bloom: rgba(255, 255, 255, .95); }   /* BURST */
    .hero {
      z-index: 0;
      transform-origin: var(--px, 50%) var(--hy, 50%);
      transition: transform var(--burst), opacity .4s ease, filter .4s ease, z-index 0s linear .7s;
    }
    .veiled .hero {
      z-index: 30;
      transform: scale(1.62);
      opacity: 0;
      filter: blur(10px);
      pointer-events: none;
      transition: transform var(--burst), opacity .38s ease-out .04s, filter .38s ease-out, z-index 0s;
    }
    .entering main { overflow: clip; }
    .enter-zone { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .enter-zone:focus-visible { outline: 1px solid var(--gold); outline-offset: -4px; }
    /* Inside: solid cream, which the login page should open on too */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--shell);
      visibility: hidden;
      transition: visibility 0s linear .7s;
    }
    .veiled .veil { visibility: visible; transition: visibility 0s; }
    .veil::before {   /* a soft flash of light from the press */
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), var(--bloom), rgba(255, 255, 255, 0) 62%);
      opacity: 0;
      pointer-events: none;
    }
    .veiled .veil::before { animation: bloom .85s ease-out both; }
    @keyframes bloom { from { opacity: 1; } to { opacity: 0; } }
    .veil-in { position: relative; }
    .veil-in {
      display: grid;
      place-items: center;
      height: 100vh;
      height: 100svh;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    /* A copy of the login card, in the same place, so the page change can't be seen */
    .box.gate { display: none; flex-direction: column; justify-content: space-between; aspect-ratio: 1.586; min-height: 216px; padding: 18px 20px 14px; border-radius: 18px; text-align: left; font-family: "Instrument Sans", sans-serif; font-weight: 500; }
    .gating .box.gate { display: block; }
    .gating .coming { display: none; }
    .gating .box.gate { display: flex; }
    .gate .c-top { display: flex; align-items: center; justify-content: space-between; }
    .gate .c-crest { display: block; height: 26px; width: auto; opacity: .92; }
    .gate .c-name { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #bdb7a4; }
    .gate .c-tap { display: block; width: 20px; height: 24px; }
    .gate .c-row { display: grid; grid-template-columns: minmax(0, .82fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
    .gate .lab { display: block; margin-bottom: 4px; font-size: 11.5px; line-height: 1.2; letter-spacing: .08em; color: #bdb7a4; }
    .gate .inp { display: block; height: 44px; border-radius: 9px; background: rgba(0, 0, 0, .24); box-shadow: inset 0 1px 1px rgba(0, 0, 0, .35), 0 .5px 0 rgba(255, 255, 255, .1); }
    .gate .go { display: grid; place-items: center; height: 44px; padding: 0 14px; border-radius: 9px; background: #ddd7c5; color: #1b3128; font-size: 15px; }
    .gate .c-foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; font-size: 11px; letter-spacing: .08em; color: #a9a594; }
    .gate .c-foot b { font-weight: inherit; color: #ddd7c5; }
    .soon {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: 0.03em;
      font-variant-caps: small-caps;
      font-feature-settings: "smcp", "kern";
      color: var(--paper);
    }
    .box {                       /* the login goes in here when it is ready */
      box-sizing: border-box;
      width: min(360px, calc(100vw - 40px));
      padding: 56px 24px 24px;
      border-radius: 28px;
      background: linear-gradient(118deg, rgba(255, 255, 255, 0) 24%, rgba(255, 255, 255, .075) 44%, rgba(255, 255, 255, 0) 66%), linear-gradient(155deg, #274237, #1b3128 52%, #14261e);
      box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .13), inset 0 .5px 0 rgba(255, 255, 255, .16), 0 1px 1px rgba(12, 22, 17, .3), 0 18px 36px -18px rgba(12, 22, 17, .6);
      text-align: center;
      opacity: 0;
      transform: scale(.86);
      transition: opacity 0.26s ease, transform 0.3s ease;
    }
    .arrived .box {
      opacity: 1;
      transform: none;
      transition: opacity 0.34s ease, transform 0.78s cubic-bezier(.2, 1.28, .32, 1);
    }
    .back {
      display: block;
      width: 100%;
      height: 52px;
      margin-top: 44px;
      border: 0;
      border-radius: 999px;
      background: var(--paper);
      color: var(--forest);
      font: inherit;
      font-size: 18px;
      letter-spacing: 0.04em;
      font-variant-caps: small-caps;
      font-feature-settings: "smcp", "kern";
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .back:hover { background: #fff8ea; }
    .back:active { transform: scale(.97); }
    .back:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
    .still .veil, .still .hero { transition: none !important; }
    .entering .cue { opacity: 0; }
    .entering .close { box-shadow: none; }
    .knocker {
      display: none;
      position: absolute;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .js .knocker { display: block; }
    .knocker:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }
    .entering .knocker, .entering .enter-zone { pointer-events: none; }
    /* Touch it and the ring lifts off the door and falls back, once, on the bar in the
       animal's mouth. The head is the photograph, left alone: only the ring is cut out,
       with a patch of bare door behind it. Invisible until then. */
    .kn { position: absolute; opacity: 0; pointer-events: none; perspective-origin: 50% 85%; transition: opacity .08s linear; }
    .kn i, .kn u, .kn b { position: absolute; background: no-repeat center / 100% 100%; }
    .kn i, .kn u { inset: 0; }
    .kn i { background-image: url("images/knocker-ring-door.webp"); }
    .kn u { background-image: url("images/knocker-ring.webp"); transform-origin: 50% 2%; filter: brightness(0) blur(2.5px); opacity: 0; will-change: transform, opacity; }
    /* The ring is drawn at twice its size and scaled back down, so it stays sharp as it tilts toward you */
    .kn b { left: -50%; top: -2%; width: 200%; height: 200%; background-image: url("images/knocker-ring.webp"); transform-origin: 50% 2%; transform: scale3d(.5, .5, .5); will-change: transform; }
    @keyframes ring-lift {
      0%   { transform: scale3d(.5, .5, .5) rotateX(0deg); animation-timing-function: cubic-bezier(.16, .8, .3, 1); }
      30%  { transform: scale3d(.5, .5, .5) rotateX(46deg); animation-timing-function: linear; }
      38%  { transform: scale3d(.5, .5, .5) rotateX(44deg); animation-timing-function: cubic-bezier(.55, 0, .9, .5); }
      60%  { transform: scale3d(.5, .5, .5) rotateX(0deg); animation-timing-function: ease-out; }
      71%  { transform: scale3d(.5, .5, .5) rotateX(9deg); animation-timing-function: ease-in; }
      83%  { transform: scale3d(.5, .5, .5) rotateX(0deg); animation-timing-function: ease-out; }
      91%  { transform: scale3d(.5, .5, .5) rotateX(2.5deg); animation-timing-function: ease-in; }
      100% { transform: scale3d(.5, .5, .5) rotateX(0deg); }
    }
    @keyframes ring-shadow {
      0%   { transform: rotateX(0deg) translateY(0); opacity: 0; animation-timing-function: cubic-bezier(.16, .8, .3, 1); }
      30%  { transform: rotateX(46deg) translateY(8px); opacity: .55; animation-timing-function: linear; }
      38%  { transform: rotateX(44deg) translateY(8px); opacity: .52; animation-timing-function: cubic-bezier(.55, 0, .9, .5); }
      60%  { transform: rotateX(0deg) translateY(0); opacity: 0; animation-timing-function: ease-out; }
      71%  { transform: rotateX(9deg) translateY(2px); opacity: .25; animation-timing-function: ease-in; }
      83%  { transform: rotateX(0deg) translateY(0); opacity: 0; animation-timing-function: ease-out; }
      91%  { transform: rotateX(2.5deg) translateY(0); opacity: 0; animation-timing-function: ease-in; }
      100% { transform: rotateX(0deg) translateY(0); opacity: 0; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .swing .kn { opacity: 1; }
      .swing .kn b { animation: ring-lift 1.2s .08s both; }
      .swing .kn u { animation: ring-shadow 1.2s .08s both; }
    }

    /* a fine line at the bottom inviting a scroll */
    .cue {
      position: absolute;
      left: 50%;
      bottom: calc(clamp(18px, 4vh, 36px) + env(safe-area-inset-bottom));
      width: 1px;
      height: 48px;
      overflow: hidden;
      transform: translateX(-50%);
      transition: opacity 0.6s ease;
    }
    .cue::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      transform-origin: top;
      animation: draw 2.6s 2s cubic-bezier(.6, 0, .3, 1) infinite both;
    }
    @keyframes draw {
      0%   { transform: scaleY(0); transform-origin: top; }
      45%  { transform: scaleY(1); transform-origin: top; }
      55%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cue::after { animation: none; transform: none; opacity: 0.6; }
      /* no burst: the photograph simply fades */
      .hero { transition: opacity .4s ease, z-index 0s linear .4s; }
      .veiled .hero { transform: none; filter: none; }
      .veil { transition: visibility 0s linear .4s; }
      .veiled .veil::before { animation: none; }
    }

    /* ---- Bar that appears once you scroll ---- */
    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: var(--bar-h);
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--glass);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      padding-bottom: 26px;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
      opacity: 0;
      visibility: hidden;
      transition: opacity .6s ease, visibility 0s linear .6s;
    }
    .bar a { display: block; padding: 6px; }
    .bar img { display: block; height: 40px; width: auto; }
    @media (max-width: 600px) { :root { --bar-h: 52px; } .bar img { height: 34px; } }
    .scrolled .bar, .scrolled .close { opacity: 1; visibility: visible; transition: opacity .6s ease, visibility 0s; }
    .entering .bar, .entering .close { opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s; }
    .scrolled .cue { opacity: 0; }

    /* ---- Below the photograph ---- */
    main { min-height: calc(100vh + 140px); min-height: calc(100svh + 140px); }
    .close {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity .6s ease, visibility 0s linear .6s;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px calc(20px + env(safe-area-inset-bottom));
      background: var(--glass);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 34px);
      mask-image: linear-gradient(to bottom, transparent, #000 34px);
      text-align: center;
    }
    /* The quote: set like an epigraph. Quote in Century roman,
       attribution in Century small capitals underneath.
       The quotes share one grid cell, so the footer is always as tall as the
       longest one and the page doesn't jump as they rotate. */
    .quotes {
      display: grid;
      width: 100%;
      max-width: 40em;
      align-items: center;
      justify-items: center;
    }
    .quote { grid-area: 1 / 1; margin: 0; max-width: 100%; }
    .js .quote {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0s linear 0.6s;
    }
    .js .quote.on {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.6s ease 0.6s, visibility 0s linear 0.6s;
    }
    .quote blockquote {
      margin: 0;
      font-size: clamp(14px, 1vw, 16px);
      line-height: 1.5;
      letter-spacing: 0.01em;
      color: var(--cream);
      text-wrap: balance;
    }
    /* Lines of verse: set flush left as a centred block, closely spaced, with the
       opening quote mark hung in the margin so the lines start on one edge.
       A line too long for a phone wraps with a hanging indent. */
    .quote blockquote.verse {
      display: inline-block;
      text-align: left;
      line-height: 1.28;
      text-wrap: wrap;
    }
    .verse .line { position: relative; display: block; padding-left: 1em; text-indent: -1em; }
    .verse .oq { position: absolute; right: 100%; text-indent: 0; }
    @media (max-width: 360px) { .quote blockquote { font-size: 13px; } }
    .quote figcaption {
      margin-top: 0.4em;
      font-size: clamp(11px, 0.8vw, 13px);
      font-variant-caps: small-caps;
      font-feature-settings: "smcp", "kern";
      letter-spacing: 0.1em;
      line-height: 1.5;
      color: var(--gold);
    }

    /* ---- Phones and tall screens ----
       A full-height crop of the doorway (transom, frame and door), centred on the
       door, fills the screen. Narrower screens lose only the sides; nothing is
       cropped from the top. The crest bar and quote appear on scroll. */
    @media (orientation: portrait) {
      .photo { object-position: 50% 0%; }
    }
    /* Dark mode: the inside is the door's own slate */
    @media (prefers-color-scheme: dark) {
      :root { --shell: #161c1f; --bloom: rgba(255, 255, 255, .14); }
      :root {
      }
      .box {
        box-shadow:
          inset 0 0 0 1px rgba(239, 232, 214, .07),
          0 24px 60px rgba(0, 0, 0, .55);
      }
    }
  </style>
</head>
<body>

  <header class="bar">
    <a href="#top" aria-label="Back to top">
      <picture>
        <source type="image/webp" srcset="images/crest.webp">
        <img src="images/crest.png" width="575" height="720" alt="Crest">
      </picture>
    </a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="stage" id="stage">
        <picture>
          <!-- Phones and other tall screens: the whole doorway, centred on the door -->
          <source media="(orientation: portrait)" type="image/webp"
                  srcset="images/doorway-1200.webp 1200w, images/doorway-1800.webp 1800w, images/doorway-2400.webp 2400w"
                  sizes="(min-aspect-ratio: 5/7) 100vw, 72vh">
          <source media="(orientation: portrait)"
                  srcset="images/doorway-1200.jpg 1200w, images/doorway-1800.jpg 1800w, images/doorway-2400.jpg 2400w"
                  sizes="(min-aspect-ratio: 5/7) 100vw, 72vh">
          <source type="image/webp"
                  srcset="images/door-1000.webp 1000w, images/door-1600.webp 1600w, images/door-2400.webp 2400w, images/door-3200.webp 3200w"
                  sizes="(max-aspect-ratio: 7/5) 140vh, 100vw">
          <img class="photo" src="images/door-2400.jpg"
               srcset="images/door-1000.jpg 1000w, images/door-1600.jpg 1600w, images/door-2400.jpg 2400w, images/door-3200.jpg 3200w"
               sizes="(max-aspect-ratio: 7/5) 140vh, 100vw"
               width="4691" height="3351"
               alt="The green front door of 44 JFK Street, with a bronze knocker and brass numerals, framed by white columns.">
        </picture>
        <button type="button" class="enter-zone" id="door" aria-label="Enter"></button>
        <button type="button" class="knocker" id="knocker" aria-label="Enter"><span class="kn"><i></i><u></u><b></b></span></button>
      </div>
      <span class="cue" aria-hidden="true"></span>
    </section>

    <footer class="close">
      <div class="quotes" id="quotes">
        <figure class="quote on">
          <blockquote>“Your genial influence awaits”</blockquote>
          <figcaption>T. S. Eliot ‘10</figcaption>
        </figure>
      </div>
    </footer>
  </main>

  <div class="veil" id="veil"><div class="veil-in">
    <div class="box coming"><p class="soon" id="soon" role="status"></p><button type="button" class="back">Back</button></div>
    <div class="box gate" aria-hidden="true"><div class="c-top"><picture><source type="image/webp" srcset="images/crest.webp"><img class="c-crest" src="images/crest.png" alt=""></picture><span class="c-name">Digamma</span></div><svg class="c-tap" viewBox="0 0 24 28" aria-hidden="true"><path d="M3 10.5c1.7 2 1.7 5 0 7M8 8c3 3.5 3 8.5 0 12M13 5.5c4.3 5 4.3 12 0 17M18 3c5.6 6.5 5.6 15.5 0 22" fill="none" stroke="#a9a594" stroke-width="1.9" stroke-linecap="round"/></svg><div class="c-row"><div><span class="lab">Initials</span><span class="inp"></span></div><div><span class="lab">PIN</span><span class="inp"></span></div><span class="go">Enter</span></div><div class="c-foot"><span>Member</span><b>Not a Member?</b></div></div>
  </div></div>

  <script>
    // Quotes from members only, changing every 7 seconds, always in this order.
    // To add one, copy a line and change the text and name ("\n" starts a new line).
    // Eliot: "Portrait of a Lady" (1917) and a Ballade (1909).
    // Hagedorn: "A Troop of the Guard", Harvard Class Poem (1907), and "Fighters" (1909).
    var QUOTES = [
      { text: "Your genial influence awaits", by: "T. S. Eliot ‘10" },
      { text: "I shall sit here, serving tea to friends.", by: "T. S. Eliot ‘10" },
      { text: "To find a friend who has these qualities,\nWho has, and gives\nThose qualities upon which friendship lives.", by: "T. S. Eliot ‘10" },
      { text: "Into the dawn, we ride, we ride,\nFellow and fellow, side by side", by: "Hermann Hagedorn ‘07" },
      { text: "Friends of the great, the high, the perilous years,\nUpon the brink of mighty things we stand", by: "Hermann Hagedorn ‘07" },
      { text: "Fearless, to rise or fall,\nArm pressed to arm we stand", by: "Hermann Hagedorn ‘07" },
      { text: "Without these friendships—life, what cauchemar!", by: "T. S. Eliot ‘10" }
    ];
    var quoteFigures = QUOTES.map(function (q) {
      var lines = q.text.split("\n");
      var fig = document.createElement("figure");
      var text = document.createElement("blockquote");
      var by = document.createElement("figcaption");
      fig.className = "quote";
      if (lines.length > 1) text.className = "verse";
      lines.forEach(function (line, n) {
        var span = document.createElement("span");
        span.className = "line";
        if (n === 0) {
          var oq = document.createElement("span");
          oq.className = "oq";
          oq.textContent = "“";
          span.appendChild(oq);
        }
        span.appendChild(document.createTextNode(line + (n === lines.length - 1 ? "”" : "")));
        text.appendChild(span);
      });
      by.textContent = q.by;
      fig.appendChild(text);
      fig.appendChild(by);
      return fig;
    });
    var quoteShowing = null;
    function showQuote(i) {
      if (quoteShowing) quoteShowing.classList.remove("on");
      quoteShowing = quoteFigures[i];
      quoteShowing.classList.add("on");
    }
    (function () {
      var box = document.getElementById("quotes");
      box.textContent = "";
      quoteFigures.forEach(function (fig) { box.appendChild(fig); });

      showQuote(0);

      // Change only while the quote is on screen, so the first one seen gets its full
      // time, and hold it while the pointer rests on it.
      var at = 0, timer, onScreen = false;
      function run(on) {
        clearInterval(timer);
        if (on) timer = setInterval(function () {
          at = (at + 1) % QUOTES.length;
          showQuote(at);
        }, 7000);
      }
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        new IntersectionObserver(function (entries) {
          onScreen = entries[entries.length - 1].isIntersecting;
          run(onScreen);
        }).observe(box);
        box.addEventListener("mouseenter", function () { run(false); });
        box.addEventListener("mouseleave", function () { run(onScreen); });
      }
    })();
  </script>

  <script>
    // Where the door leads. Left empty, it would end on a quiet "Coming soon" screen.
    var MEMBERS_URL = "https://members.44jfk.com/login";

    if (MEMBERS_URL) {
      var preconnect = document.createElement('link');
      preconnect.rel = 'preconnect';
      preconnect.href = MEMBERS_URL;
      document.head.appendChild(preconnect);
      if (document.fonts && document.fonts.load) document.fonts.load('500 16px "Instrument Sans"');
      var ahead = document.createElement('link');     // the login's font, so its words appear at once
      ahead.rel = 'prefetch';
      ahead.as = 'font';
      ahead.crossOrigin = 'anonymous';
      ahead.href = new URL('/_auth/font.woff2', MEMBERS_URL).href;
      document.head.appendChild(ahead);
    }

    var veil = document.getElementById('veil');
    var stage = document.getElementById('stage');
    var photo = stage.querySelector('.photo');
    var doorZone = document.getElementById('door');
    var soon = document.getElementById('soon');
    var knocker = document.getElementById('knocker');

    // Where the door's painted edges and the knocker sit in each photograph,
    // as fractions of its width and height. The brass strip around it belongs to the frame.
    var DOORS = {
      landscape: { tl: [.3175, .2174], tr: [.6909, .2151], br: [.6922, 1], bl: [.3180, 1], knocker: [.483, .31, .529, .422], ring: [.48581, .36765, .51992, .41301] },
      portrait:  { tl: [.1341, .2175], tr: [.8649, .2149], br: [.8677, 1], bl: [.1353, 1], knocker: [.455, .31, .548, .422], ring: [.46333, .36765, .53, .41301] }
    };

    // Lay the door and knocker over the photograph as it is cropped on this screen
    function placeDoor() {
      var iw = photo.naturalWidth, ih = photo.naturalHeight;
      if (!iw) return;
      var W = stage.offsetWidth, H = stage.offsetHeight;
      var door = ih > iw ? DOORS.portrait : DOORS.landscape;
      var scale = Math.max(W / iw, H / ih), rw = iw * scale, rh = ih * scale;
      var ox = (W - rw) * parseFloat(getComputedStyle(photo).objectPosition) / 100;
      // Pressing anywhere on the door goes in
      var doorLeft = ox + Math.min(door.tl[0], door.bl[0]) * rw, doorTop = Math.min(door.tl[1], door.tr[1]) * rh;
      doorZone.style.left = doorLeft + 'px';
      doorZone.style.top = doorTop + 'px';
      doorZone.style.width = ox + Math.max(door.tr[0], door.br[0]) * rw - doorLeft + 'px';
      doorZone.style.height = H - doorTop + 'px';

      var k = door.knocker;
      knocker.style.left = ox + k[0] * rw + 'px';
      knocker.style.top = k[1] * rh + 'px';
      knocker.style.width = (k[2] - k[0]) * rw + 'px';
      knocker.style.height = (k[3] - k[1]) * rh + 'px';
      var r = door.ring, kn = knocker.querySelector('.kn');
      kn.style.left = (r[0] - k[0]) * rw + 'px';
      kn.style.top = (r[1] - k[1]) * rh + 'px';
      kn.style.width = (r[2] - r[0]) * rw + 'px';
      kn.style.height = (r[3] - r[1]) * rh + 'px';
      kn.style.perspective = (r[3] - r[1]) * rh * 5 + 'px';
    }

    // Fade the photograph in once it has loaded.
    // (It loads again if turning a phone switches to the other crop.)
    function show() { photo.classList.add('loaded'); placeDoor(); }
    photo.addEventListener('load', show);
    photo.addEventListener('error', show);
    if (photo.complete) show();
    window.addEventListener('resize', placeDoor);

    var ARRIVES = 90;   // the card starts to spring up just after the press
    var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var entering = false, timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

    var themeColor = document.querySelector('meta[name="theme-color"]');
    function enter(e) {
      if (entering) return;
      entering = true;
      var body = document.body.classList;
      soon.textContent = MEMBERS_URL ? '' : 'Coming soon';
      if (MEMBERS_URL) body.add('gating');
      // The burst starts where the door was pressed (at the knocker, from a keyboard)
      var root = document.documentElement.style, hero = document.querySelector('.hero'), k = knocker.getBoundingClientRect();
      var x = e && e.detail ? e.clientX : k.left + k.width / 2, y = e && e.detail ? e.clientY : k.top + k.height / 2;
      root.setProperty('--px', x + 'px');
      root.setProperty('--py', y + 'px');
      root.setProperty('--hy', y - hero.getBoundingClientRect().top + 'px');
      void hero.offsetWidth;
      body.add('entering', 'veiled');
      themeColor.content = getComputedStyle(document.documentElement).getPropertyValue('--shell').trim();
      later(function () {
        body.add('arrived');
        if (MEMBERS_URL) later(function () { location.assign(MEMBERS_URL); }, 850);   // once the card has settled
      }, calm ? 100 : ARRIVES);
    }
    knocker.addEventListener('click', enter);
    doorZone.addEventListener('click', enter);

    // Bring the photograph back down, or put it back unseen after the Back button.
    function backToDoor(instant) {
      timers.forEach(clearTimeout);
      timers = [];
      var body = document.body.classList;
      if (instant === true) body.add('still');
      body.remove('entering', 'veiled', 'arrived', 'gating');
      themeColor.content = '#1f282c';
      void veil.offsetWidth;
      body.remove('still');
      entering = false;
    }

    veil.addEventListener('click', function () {
      if (document.body.classList.contains('arrived') && !document.body.classList.contains('gating')) backToDoor();
    });
    window.addEventListener('pageshow', function (e) { if (e.persisted) backToDoor(true); });   // coming back with the Back button

    // The ring lifts and falls once, and always finishes, even if the pointer moves away
    function swing() { if (!calm) knocker.classList.add('swing'); }
    knocker.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') swing(); });
    knocker.addEventListener('animationend', function (e) { if (e.animationName === 'ring-lift') knocker.classList.remove('swing'); });
    // Phones have no hover, so the knocker shows off once by itself
    if (matchMedia('(hover: none)').matches) setTimeout(swing, 3500);

    // Reveal the bar after the first bit of scrolling
    function onScroll() { document.body.classList.toggle('scrolled', window.scrollY > 16); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
