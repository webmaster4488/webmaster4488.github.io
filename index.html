<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Digamma</title>
  <meta name="apple-mobile-web-app-title" content="Digamma">
  <meta name="description" content="44 JFK Street, Cambridge, Massachusetts.">
  <meta name="theme-color" content="#1f282c">
  <script>document.documentElement.classList.add('js')</script>

  <!-- Link previews (iMessage, WhatsApp, Slack, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://44jfk.com/">
  <meta property="og:site_name" content="Digamma">
  <meta property="og:title" content="Digamma">
  <meta property="og:description" content="Cambridge, Massachusetts">
  <meta property="og:image" content="https://44jfk.com/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- TeX Gyre Schola, GUST Font License; see fonts/LICENSE.txt -->
  <link rel="preload" href="fonts/schola-sc.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="preload" as="image" type="image/webp" media="(orientation: landscape)"
        imagesrcset="images/door-1000.webp 1000w, images/door-1600.webp 1600w, images/door-2400.webp 2400w, images/door-3200.webp 3200w"
        imagesizes="(max-aspect-ratio: 7/5) 140vh, 100vw">
  <link rel="preload" as="image" type="image/webp" media="(orientation: portrait)"
        imagesrcset="images/doorway-1200.webp 1200w, images/doorway-1800.webp 1800w, images/doorway-2400.webp 2400w"
        imagesizes="(min-aspect-ratio: 5/7) 100vw, 72vh">

  <style>
    @font-face {
      font-family: "Schola";
      src: url("fonts/schola-sc.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {       /* the login's typeface; see fonts/OFL-alegreya-sans.txt */
      font-family: "Alegreya Sans";
      src: url("fonts/alegreya-sans-latin-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    :root {
      --green: #1f282c;
      --green-deep: #161c1f;
      --gold: #d2a03d;
      --cream: #efe8d6;
      --bar-h: 62px;
      --shell: #f3ecdd;          /* the screen beyond the door; door slate in dark mode */
      --paper: #f3ecdd;
      --glass: rgba(31, 40, 44, 0.57);   /* the top and bottom bars match */
      --glass-blur: blur(18px) saturate(1.3);
      --forest: #234030;
      /* The hall beyond the door. Its far wall is --shell exactly. */
      --floor-near: #bdb097; --floor-far: #ddd3bf;
      --ceil-near: #d8cfbd; --ceil-far: #e9e1d0;
      --side-near: #cfc5b1; --side-far: #e6ddcb;
      --head-near: #c7c2b6; --head-far: #a9a497;
      --strike-near: #f1ede3; --strike-far: #cbc5b7;
      --hinge-near: #d6d1c5; --hinge-far: #b4aea1;
      /* The one place the typeface is set. */
      --font: "Schola", "Century", Georgia, serif;
    }

    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      margin: 0;
      background: var(--green-deep);
      color: var(--cream);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- The photograph: the whole screen ---- */
    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: var(--green-deep);
    }
    .stage {
      position: absolute;
      inset: 0;
      transform-origin: 50% 0;     /* the drift keeps the top edge fixed */
    }
    .photo, .wall {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50.4% 0%;   /* never crop the top: trim the bottom only */
    }
    .js .photo { opacity: 0; }
    .js .photo.loaded {
      opacity: 1;
      transition: opacity 1.6s ease;
    }
    /* A slow drift toward the door */
    .stage.drift { animation: drift 40s ease-out both; }
    @keyframes drift {
      from { transform: none; }
      to   { transform: scale(1.03); }
    }

    /* ---- Knocking: the door swings open and you walk through it ----
       A real 3D scene laid exactly over the photograph and hidden until the knocker
       is pressed, so at rest the page is only the photograph. Everything in it is
       placed by placeDoor(), and everything at z = 0 lands on the photograph's own pixels.
       .doorway holds the perspective (the eye). .camera is the world, which moves toward
       the eye to walk in. In it: a hall of plain planes, the frame's jambs and head, the
       door as a slab, and a copy of the photograph as the wall, with the door's shape cut
       out of it. Nothing from .camera to a face may use overflow, clip-path, filter or
       opacity, which would flatten it; only the faces themselves are clipped. */
    .doorway {
      position: absolute;
      inset: 0;
      visibility: hidden;
      will-change: transform;   /* keeps the page's layers the same before and during a knock */
    }
    .knocking .doorway { visibility: visible; }
    .open .doorway { background: var(--shell); }
    .camera, .leaf { position: absolute; transform-style: preserve-3d; }
    .camera { inset: 0; will-change: transform; }
    .entering .camera { transition: transform 1.35s cubic-bezier(.5, 0, .3, 1); }   /* ZOOM_TIME */
    .wall { position: absolute; left: 0; top: 0; width: 100%; height: 100%; max-width: none; }
    /* Each plane is a small square scaled up by placeDoor(), so it costs almost no memory */
    .plane { position: absolute; left: 0; top: 0; width: 100px; height: 100px; transform-origin: 0 0; }
    .far   { background: var(--shell); }
    .floor { background: linear-gradient(var(--floor-near), var(--floor-far)); }
    .ceil  { background: linear-gradient(var(--ceil-near), var(--ceil-far)); }
    .side  { background: linear-gradient(to right, var(--side-near), var(--side-far)); }
    .head   { background: linear-gradient(var(--head-near), var(--head-far)); }
    .strike { background: linear-gradient(to right, var(--strike-near), var(--strike-far)); }
    .hinge  { background: linear-gradient(to right, var(--hinge-near), var(--hinge-far)); }
    /* Inside: solid cream, which the login page should open on too */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--shell);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease, visibility 0s linear 1.2s;
    }
    .veiled .veil { opacity: 1; visibility: visible; transition: opacity 0.45s ease-in, visibility 0s; }
    .veil-in {
      display: grid;
      place-items: center;
      height: 100vh;
      height: 100svh;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    /* A copy of the login card, in the same place, so the page change can't be seen */
    .box.gate { display: none; padding: 32px 24px 24px; text-align: left; font-family: "Alegreya Sans", sans-serif; font-weight: 500; }
    .gating .box.gate { display: block; }
    .gating .coming { display: none; }
    .gate .fld { margin-bottom: 16px; }
    .gate .lab { display: block; margin-bottom: 6px; font-size: 16px; line-height: 1.2; color: var(--paper); }
    .gate .inp { display: block; height: 50px; border-radius: 12px; background: rgba(243, 236, 221, .12); }
    .gate .go {
      display: flex; align-items: center; justify-content: center;
      height: 52px; margin-top: 12px; border-radius: 999px;
      background: var(--paper); color: var(--forest);
      font-size: 18px; line-height: 1; letter-spacing: .01em;
    }
    .soon {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: 0.03em;
      font-variant-caps: small-caps;
      font-feature-settings: "smcp", "kern";
      color: var(--paper);
    }
    .box {                       /* the login goes in here when it is ready */
      box-sizing: border-box;
      width: min(360px, calc(100vw - 40px));
      padding: 56px 24px 24px;
      border-radius: 28px;
      background: linear-gradient(170deg, #2f5540, var(--forest) 55%, #1c3427);
      box-shadow:
        0 1px 2px rgba(35, 64, 48, .1),
        0 12px 32px rgba(35, 64, 48, .18),
        0 40px 80px rgba(35, 64, 48, .16);
      text-align: center;
      opacity: 0;
      transform: translateY(14px) scale(.95);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .arrived .box {
      opacity: 1;
      transform: none;
      transition: opacity 0.5s ease 0.05s, transform 0.75s cubic-bezier(.16, 1, .3, 1) 0.05s;
    }
    .back {
      display: block;
      width: 100%;
      height: 52px;
      margin-top: 44px;
      border: 0;
      border-radius: 999px;
      background: var(--paper);
      color: var(--forest);
      font: inherit;
      font-size: 18px;
      letter-spacing: 0.04em;
      font-variant-caps: small-caps;
      font-feature-settings: "smcp", "kern";
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .back:hover { background: #fff8ea; }
    .back:active { transform: scale(.97); }
    .back:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
    .still .camera, .still .leaf, .still .face::after { transition: none !important; }
    .entering .cue { opacity: 0; }
    .entering .close { box-shadow: none; }
    .leaf {
      transform-origin: 0 50% calc(var(--thick) * -1);   /* the inner corner of the hinge side */
      will-change: transform;
      transition: transform 1.05s cubic-bezier(.5, 0, .22, 1);
    }
    .face { position: absolute; inset: 0; overflow: hidden; background: #1d2a2f; }
    .face img { position: absolute; max-width: none; object-fit: cover; }
    .face::after {   /* the street's light leaves the door as it turns, from the far side inward */
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -200%;
      width: 300%;
      background: linear-gradient(to right, rgba(0, 0, 0, .3) 40%, rgba(0, 0, 0, .78) 66%, rgba(0, 0, 0, .86));
      opacity: 0;
      transform: translateX(34%);
      transition: opacity 1.05s cubic-bezier(.5, 0, .22, 1), transform 1.05s cubic-bezier(.5, 0, .22, 1);
    }
    .edge {   /* the hinge side of the slab, which comes round to face the street */
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: var(--thick);
      transform-origin: 0 50%;
      transform: rotateY(90deg);
      background: linear-gradient(to right, #46565c, #1f2a2e);
    }
    .open .leaf { transform: rotateY(88deg); }
    .open .face::after { opacity: 1; transform: none; }
    .rap .leaf { animation: rap .95s linear; }
    @keyframes rap {   /* three raps; their times match RAPS in the script */
      0%, 10%, 31%, 41%, 63%, 73%, 100% { transform: none; }
      2%, 33%, 65%                      { transform: rotateY(.35deg); }
    }
    .knocker {
      display: none;
      position: absolute;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .js .knocker { display: block; }
    .knocker:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }
    .knocking .knocker { opacity: 0; pointer-events: none; }
    /* Touch it and the knocker comes loose: it pops off the door and rattles on its hinge.
       It's a feathered copy of the photograph, invisible until then. */
    .kn { position: absolute; inset: 0; opacity: 0; transform-origin: 50% 8%; pointer-events: none; }
    .kn i {
      position: absolute;
      inset: -8%;
      background-repeat: no-repeat;
      -webkit-mask-image: radial-gradient(closest-side, #000 82%, transparent 100%);
      mask-image: radial-gradient(closest-side, #000 82%, transparent 100%);
    }
    @keyframes kn-pop {
      0%   { transform: none; }
      16%  { transform: translateY(-1.5%) scale(1.08) rotate(-2.5deg); }
      30%  { transform: translateY(-.5%) scale(1.06) rotate(2.5deg); }
      44%  { transform: translateY(-1.5%) scale(1.07) rotate(-1.5deg); }
      58%  { transform: translateY(-2%) scale(1.09) rotate(1.2deg); }
      74%  { transform: translateY(-1%) scale(1.06) rotate(-.6deg); }
      100% { transform: translateY(-1%) scale(1.07) rotate(0); }
    }
    @keyframes kn-rattle {
      0%, 78%, 100% { transform: translateY(-1%) scale(1.07) rotate(0); }
      82% { transform: translateY(-1.2%) scale(1.075) rotate(-1deg); }
      86% { transform: translateY(-1%) scale(1.07) rotate(1deg); }
      90% { transform: translateY(-1.2%) scale(1.072) rotate(-.5deg); }
      94% { transform: translateY(-1%) scale(1.07) rotate(.3deg); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .tease .kn { opacity: 1; filter: drop-shadow(0 5px 5px rgba(0, 0, 0, .45)); animation: kn-pop .85s ease-out both; }
    }
    @media (prefers-reduced-motion: no-preference) and (hover: hover) {
      .knocker:hover .kn { opacity: 1; filter: drop-shadow(0 5px 5px rgba(0, 0, 0, .45)); animation: kn-pop .85s ease-out both, kn-rattle 2.6s .85s infinite; }
    }

    /* a fine line at the bottom inviting a scroll */
    .cue {
      position: absolute;
      left: 50%;
      bottom: calc(clamp(18px, 4vh, 36px) + env(safe-area-inset-bottom));
      width: 1px;
      height: 48px;
      overflow: hidden;
      transform: translateX(-50%);
      transition: opacity 0.6s ease;
    }
    .cue::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      transform-origin: top;
      animation: draw 2.6s 2s cubic-bezier(.6, 0, .3, 1) infinite both;
    }
    @keyframes draw {
      0%   { transform: scaleY(0); transform-origin: top; }
      45%  { transform: scaleY(1); transform-origin: top; }
      55%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cue::after { animation: none; transform: none; opacity: 0.6; }
      .stage.drift, .rap .leaf { animation: none; }
      /* no swing and no walk: the door dissolves and the screen fades up */
      .leaf { transition: opacity 0.8s ease; }
      .open .leaf { transform: none; opacity: 0; }
      .face::after, .open .face::after { transition: none; opacity: 0; }
      .entering .camera { transition: none; }
    }

    /* ---- Bar that appears once you scroll ---- */
    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: var(--bar-h);
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--glass);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      padding-bottom: 26px;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
      transform: translateY(calc(-100% - 32px));
      transition: transform 1.25s cubic-bezier(.12, .82, .18, 1);
      transition-timing-function: linear(0, .36 7%, .68 16%, .86 27%, .94 39%, .98 54%, .995 74%, 1);
    }
    .bar a { display: block; padding: 6px; }
    .bar img { display: block; height: 40px; width: auto; }
    @media (max-width: 600px) { :root { --bar-h: 52px; } .bar img { height: 34px; } }
    .scrolled .bar, .scrolled .close { transform: none; }
    .entering .bar { transform: translateY(calc(-100% - 32px)); transition-duration: .45s; }
    .entering .close { transform: translateY(calc(100% + 32px)); transition-duration: .45s; }
    .scrolled .cue { opacity: 0; }

    /* ---- Below the photograph ---- */
    main { min-height: calc(100vh + 140px); min-height: calc(100svh + 140px); }
    .close {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      transform: translateY(calc(100% + 32px));
      transition: transform 1.25s cubic-bezier(.12, .82, .18, 1);
      transition-timing-function: linear(0, .36 7%, .68 16%, .86 27%, .94 39%, .98 54%, .995 74%, 1);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px calc(20px + env(safe-area-inset-bottom));
      background: var(--glass);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 34px);
      mask-image: linear-gradient(to bottom, transparent, #000 34px);
      text-align: center;
    }
    /* The quote: set like an epigraph. Quote in Century roman,
       attribution in Century small capitals underneath.
       The quotes share one grid cell, so the footer is always as tall as the
       longest one and the page doesn't jump as they rotate. */
    .quotes {
      display: grid;
      width: 100%;
      max-width: 40em;
      align-items: center;
      justify-items: center;
    }
    .quote { grid-area: 1 / 1; margin: 0; max-width: 100%; }
    .js .quote {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0s linear 0.6s;
    }
    .js .quote.on {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.6s ease 0.6s, visibility 0s linear 0.6s;
    }
    .quote blockquote {
      margin: 0;
      font-size: clamp(14px, 1vw, 16px);
      line-height: 1.5;
      letter-spacing: 0.01em;
      color: var(--cream);
      text-wrap: balance;
    }
    /* Lines of verse: set flush left as a centred block, closely spaced, with the
       opening quote mark hung in the margin so the lines start on one edge.
       A line too long for a phone wraps with a hanging indent. */
    .quote blockquote.verse {
      display: inline-block;
      text-align: left;
      line-height: 1.28;
      text-wrap: wrap;
    }
    .verse .line { position: relative; display: block; padding-left: 1em; text-indent: -1em; }
    .verse .oq { position: absolute; right: 100%; text-indent: 0; }
    @media (max-width: 360px) { .quote blockquote { font-size: 13px; } }
    .quote figcaption {
      margin-top: 0.4em;
      font-size: clamp(11px, 0.8vw, 13px);
      font-variant-caps: small-caps;
      font-feature-settings: "smcp", "kern";
      letter-spacing: 0.1em;
      line-height: 1.5;
      color: var(--gold);
    }

    /* ---- Phones and tall screens ----
       A full-height crop of the doorway (transom, frame and door), centred on the
       door, fills the screen. Narrower screens lose only the sides; nothing is
       cropped from the top. The crest bar and quote appear on scroll. */
    @media (orientation: portrait) {
      .photo, .wall { object-position: 50% 0%; }
    }
    /* Dark mode: the door opens onto the hall at night, in the door's own slate */
    @media (prefers-color-scheme: dark) {
      :root { --shell: #161c1f; }
      :root {
        --floor-near: #0d1113; --floor-far: #12171a;
        --ceil-near: #0f1416; --ceil-far: #13191c;
        --side-near: #29343a; --side-far: #1c2427;
        --head-near: #4b5356; --head-far: #2a3236;
        --strike-near: #8d8f8a; --strike-far: #3a4448;
        --hinge-near: #6a6f6e; --hinge-far: #2f393d;
      }
      .box {
        box-shadow:
          inset 0 0 0 1px rgba(239, 232, 214, .07),
          0 24px 60px rgba(0, 0, 0, .55);
      }
    }
  </style>
</head>
<body>

  <header class="bar">
    <a href="#top" aria-label="Back to top">
      <picture>
        <source type="image/webp" srcset="images/crest.webp">
        <img src="images/crest.png" width="575" height="720" alt="Crest">
      </picture>
    </a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="stage" id="stage">
        <picture>
          <!-- Phones and other tall screens: the whole doorway, centred on the door -->
          <source media="(orientation: portrait)" type="image/webp"
                  srcset="images/doorway-1200.webp 1200w, images/doorway-1800.webp 1800w, images/doorway-2400.webp 2400w"
                  sizes="(min-aspect-ratio: 5/7) 100vw, 72vh">
          <source media="(orientation: portrait)"
                  srcset="images/doorway-1200.jpg 1200w, images/doorway-1800.jpg 1800w, images/doorway-2400.jpg 2400w"
                  sizes="(min-aspect-ratio: 5/7) 100vw, 72vh">
          <source type="image/webp"
                  srcset="images/door-1000.webp 1000w, images/door-1600.webp 1600w, images/door-2400.webp 2400w, images/door-3200.webp 3200w"
                  sizes="(max-aspect-ratio: 7/5) 140vh, 100vw">
          <img class="photo" src="images/door-2400.jpg"
               srcset="images/door-1000.jpg 1000w, images/door-1600.jpg 1600w, images/door-2400.jpg 2400w, images/door-3200.jpg 3200w"
               sizes="(max-aspect-ratio: 7/5) 140vh, 100vw"
               width="4691" height="3351"
               alt="The green front door of 44 JFK Street, with a bronze knocker and brass numerals, framed by white columns.">
        </picture>
        <div class="doorway" id="doorway">
          <div class="camera" id="camera">
            <div class="plane far" id="far"></div>
            <div class="plane floor" id="floor"></div>
            <div class="plane ceil" id="ceil"></div>
            <div class="plane side" id="lwall"></div>
            <div class="plane side" id="rwall"></div>
            <div class="plane head" id="head"></div>
            <div class="plane strike" id="strike"></div>
            <div class="plane hinge" id="hinge"></div>
            <div class="leaf" id="leaf">
              <div class="face" id="face">
                <img alt="" decoding="sync">
                <img alt="" decoding="sync">
              </div>
              <div class="edge"></div>
            </div>
            <img class="wall" id="wall" alt="" decoding="sync">
          </div>
        </div>
        <button type="button" class="knocker" id="knocker" aria-label="Knock"><span class="kn"><i></i></span></button>
      </div>
      <span class="cue" aria-hidden="true"></span>
    </section>

    <footer class="close">
      <div class="quotes" id="quotes">
        <figure class="quote on">
          <blockquote>“Your genial influence awaits”</blockquote>
          <figcaption>T. S. Eliot ‘10</figcaption>
        </figure>
      </div>
    </footer>
  </main>

  <div class="veil" id="veil"><div class="veil-in">
    <div class="box coming"><p class="soon" id="soon" role="status"></p><button type="button" class="back">Back</button></div>
    <div class="box gate" aria-hidden="true"><div class="fld"><span class="lab">Initials</span><span class="inp"></span></div><div class="fld"><span class="lab">Password</span><span class="inp"></span></div><span class="go">Enter</span></div>
  </div></div>

  <script>
    // Quotes from members only, changing every 7 seconds, always in this order.
    // To add one, copy a line and change the text and name ("\n" starts a new line).
    // Eliot: "Portrait of a Lady" (1917) and a Ballade (1909).
    // Hagedorn: "A Troop of the Guard", Harvard Class Poem (1907), and "Fighters" (1909).
    var QUOTES = [
      { text: "Your genial influence awaits", by: "T. S. Eliot ‘10" },
      { text: "I shall sit here, serving tea to friends.", by: "T. S. Eliot ‘10" },
      { text: "To find a friend who has these qualities,\nWho has, and gives\nThose qualities upon which friendship lives.", by: "T. S. Eliot ‘10" },
      { text: "Into the dawn, we ride, we ride,\nFellow and fellow, side by side", by: "Hermann Hagedorn ‘07" },
      { text: "Friends of the great, the high, the perilous years,\nUpon the brink of mighty things we stand", by: "Hermann Hagedorn ‘07" },
      { text: "Fearless, to rise or fall,\nArm pressed to arm we stand", by: "Hermann Hagedorn ‘07" },
      { text: "Without these friendships—life, what cauchemar!", by: "T. S. Eliot ‘10" }
    ];
    var quoteFigures = QUOTES.map(function (q) {
      var lines = q.text.split("\n");
      var fig = document.createElement("figure");
      var text = document.createElement("blockquote");
      var by = document.createElement("figcaption");
      fig.className = "quote";
      if (lines.length > 1) text.className = "verse";
      lines.forEach(function (line, n) {
        var span = document.createElement("span");
        span.className = "line";
        if (n === 0) {
          var oq = document.createElement("span");
          oq.className = "oq";
          oq.textContent = "“";
          span.appendChild(oq);
        }
        span.appendChild(document.createTextNode(line + (n === lines.length - 1 ? "”" : "")));
        text.appendChild(span);
      });
      by.textContent = q.by;
      fig.appendChild(text);
      fig.appendChild(by);
      return fig;
    });
    var quoteShowing = null;
    function showQuote(i) {
      if (quoteShowing) quoteShowing.classList.remove("on");
      quoteShowing = quoteFigures[i];
      quoteShowing.classList.add("on");
    }
    (function () {
      var box = document.getElementById("quotes");
      box.textContent = "";
      quoteFigures.forEach(function (fig) { box.appendChild(fig); });

      showQuote(0);

      // Change only while the quote is on screen, so the first one seen gets its full
      // time, and hold it while the pointer rests on it.
      var at = 0, timer, onScreen = false;
      function run(on) {
        clearInterval(timer);
        if (on) timer = setInterval(function () {
          at = (at + 1) % QUOTES.length;
          showQuote(at);
        }, 7000);
      }
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        new IntersectionObserver(function (entries) {
          onScreen = entries[entries.length - 1].isIntersecting;
          run(onScreen);
        }).observe(box);
        box.addEventListener("mouseenter", function () { run(false); });
        box.addEventListener("mouseleave", function () { run(onScreen); });
      }
    })();
  </script>

  <script>
    // When the login is ready, put its address here and a knock will lead straight to it:
    // var MEMBERS_URL = "https://members.44jfk.com/login";
    // Until then the zoom ends on the quiet "Coming soon" screen.
    var MEMBERS_URL = "";

    if (MEMBERS_URL) {
      var preconnect = document.createElement('link');
      preconnect.rel = 'preconnect';
      preconnect.href = MEMBERS_URL;
      document.head.appendChild(preconnect);
      if (document.fonts && document.fonts.load) document.fonts.load('500 16px "Alegreya Sans"');
      var ahead = document.createElement('link');     // the login's font, so its words appear at once
      ahead.rel = 'prefetch';
      ahead.as = 'font';
      ahead.crossOrigin = 'anonymous';
      ahead.href = new URL('/_auth/font.woff2', MEMBERS_URL).href;
      document.head.appendChild(ahead);
    }

    var camera = document.getElementById('camera');
    var veil = document.getElementById('veil');
    var stage = document.getElementById('stage');
    var photo = stage.querySelector('.photo');
    var doorway = document.getElementById('doorway');
    var leaf = document.getElementById('leaf');
    var face = document.getElementById('face');
    var wall = document.getElementById('wall');
    var soon = document.getElementById('soon');
    var knocker = document.getElementById('knocker');

    // Where the door's painted edges and the knocker sit in each photograph,
    // as fractions of its width and height. The brass strip around it belongs to the frame.
    var DOORS = {
      landscape: { tl: [.3175, .2174], tr: [.6909, .2151], br: [.6922, 1], bl: [.3180, 1], knocker: [.483, .31, .529, .422], wreath: [.503, .0254] },
      portrait:  { tl: [.1341, .2175], tr: [.8649, .2149], br: [.8677, 1], bl: [.1353, 1], knocker: [.455, .31, .548, .422], wreath: [.4985, .027] }
    };
    var EYE = .52;   // the camera's eye level, as a fraction of the photograph's height
    var GROUND = 1.3;   // how far below the top of the photograph the threshold lies, in its heights
    var opening;     // the doorway on this screen, set by placeDoor() and used by zoomIn()

    // Lay the door and knocker over the photograph as it is cropped on this screen
    function placeDoor() {
      var iw = photo.naturalWidth, ih = photo.naturalHeight;
      if (!iw) return;
      var W = stage.offsetWidth, H = stage.offsetHeight;
      var door = ih > iw ? DOORS.portrait : DOORS.landscape;
      var scale = Math.max(W / iw, H / ih), rw = iw * scale, rh = ih * scale;
      var ox = (W - rw) * parseFloat(getComputedStyle(photo).objectPosition) / 100;
      // A whole-pixel box, so the copy of the photograph lands on the very pixels of the original
      var left = Math.floor(ox + Math.min(door.tl[0], door.bl[0]) * rw), top = Math.floor(Math.min(door.tl[1], door.tr[1]) * rh);
      var width = Math.ceil(ox + Math.max(door.tr[0], door.br[0]) * rw) - left;
      var ground = Math.ceil(rh * GROUND);      // well below the screen: the photograph cuts the door off
      var height = ground - top;
      var seen = Math.min(H, rh) - top;

      function corner(p, y) { return (ox + p[0] * rw - left) + 'px ' + (y === undefined ? p[1] * rh - top : y) + 'px'; }
      var outline = 'polygon(' + [corner(door.tl), corner(door.tr), corner(door.br, height), corner(door.bl, height)].join(',') + ')';

      // The eye, opposite the middle of the door, and everything measured from it
      var eyeX = left + width / 2, eyeY = rh * EYE, eye = width * 2.3;
      var thick = width * .06, reveal = width * .24;
      var hallLeft = eyeX - width * .62, hallWidth = width * 1.24, ceiling = top - width * .1, hallHeight = ground - ceiling, hall = eye * 1.6;
      doorway.style.perspective = eye + 'px';
      doorway.style.perspectiveOrigin = eyeX + 'px ' + eyeY + 'px';
      doorway.style.setProperty('--thick', thick + 'px');

      function plane(id, x, y, z, turn, w, h) {
        document.getElementById(id).style.transform = 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px) ' + turn + ' scale(' + w / 100 + ',' + h / 100 + ')';
      }
      plane('far', hallLeft, ceiling, -hall, '', hallWidth, hallHeight);
      plane('floor', hallLeft, ground, 0, 'rotateX(-90deg)', hallWidth, hall);
      plane('ceil', hallLeft, ceiling, 0, 'rotateX(-90deg)', hallWidth, hall);
      plane('lwall', hallLeft, ceiling, 0, 'rotateY(90deg)', hall, hallHeight);
      plane('rwall', hallLeft + hallWidth, ceiling, 0, 'rotateY(90deg)', hall, hallHeight);
      plane('head', left, top, 0, 'rotateX(-90deg)', width, reveal);
      plane('strike', left + width, top, 0, 'rotateY(90deg)', reveal, height);
      plane('hinge', left, top, 0, 'rotateY(90deg)', reveal, height);

      // Walk until the far wall, and so the destination colour, fills the screen
      var fill = 1.06 * Math.max(eyeX / (eyeX - hallLeft), (W - eyeX) / (hallLeft + hallWidth - eyeX), eyeY / (eyeY - ceiling), (H - eyeY) / (ground - eyeY));
      opening = { dolly: eye + hall - eye / fill };

      leaf.style.left = left + 'px';
      leaf.style.top = top + 'px';
      leaf.style.width = width + 'px';
      leaf.style.height = height + 'px';

      // The wall: the photograph again, in the same box, with the door cut out of it. The cut
      // is a pixel inside the door's outline, so no seam can show around the leaf.
      if (wall.getAttribute('src') !== photo.currentSrc) wall.src = photo.currentSrc;
      function at(a, b, y) { return ox + (a[0] + (b[0] - a[0]) * (y - a[1] * rh) / (b[1] * rh - a[1] * rh)) * rw; }
      wall.style.clipPath = 'polygon(0 0,' + W + 'px 0,' + W + 'px ' + H + 'px,' +
        (at(door.tr, door.br, H) - 1) + 'px ' + H + 'px,' +
        (ox + door.tr[0] * rw - 1) + 'px ' + (door.tr[1] * rh + 1) + 'px,' +
        (ox + door.tl[0] * rw + 1) + 'px ' + (door.tl[1] * rh + 1) + 'px,' +
        (at(door.tl, door.bl, H) + 1) + 'px ' + H + 'px,0 ' + H + 'px)';

      // The leaf shows the same photograph at its full width, as parts of the door lie off
      // the screen until it turns; a whole-pixel box keeps it on the original's pixels. The
      // second copy, flipped, carries the panels on below the bottom of the picture.
      var imgs = face.querySelectorAll('img');
      var boxLeft = Math.floor(ox + 1e-6);
      for (var i = 0; i < 2; i++) {
        if (imgs[i].getAttribute('src') !== photo.currentSrc) imgs[i].src = photo.currentSrc;
        imgs[i].style.width = Math.floor(rw + 1e-6) + 'px';
        imgs[i].style.height = rh + 'px';
        imgs[i].style.objectPosition = ox - boxLeft + 'px 0';
        imgs[i].style.left = boxLeft - left + 'px';
        imgs[i].style.top = (i ? rh : 0) - top + 'px';
      }
      imgs[1].style.transform = 'scaleY(-1)';
      face.style.clipPath = outline;

      var k = door.knocker;
      knocker.style.left = ox + k[0] * rw + 'px';
      knocker.style.top = k[1] * rh + 'px';
      knocker.style.width = (k[2] - k[0]) * rw + 'px';
      knocker.style.height = (k[3] - k[1]) * rh + 'px';
      // The crest in the top bar sits in the middle of the wreath in the photograph
      var crest = document.querySelector('.bar a');
      var crestY = door.wreath[1] * rh - (crest.offsetTop + crest.offsetHeight / 2);
      crest.style.transform = 'translate(' + (ox + door.wreath[0] * rw - (crest.offsetLeft + crest.offsetWidth / 2)) + 'px,' + Math.max(-12, Math.min(12, crestY)) + 'px)';

      var kn = knocker.querySelector('i');
      kn.style.backgroundImage = 'url("' + photo.currentSrc + '")';
      kn.style.backgroundSize = rw + 'px ' + rh + 'px';
      kn.style.backgroundPosition = -(k[0] * rw - (k[2] - k[0]) * rw * .08) + 'px ' + -(k[1] * rh - (k[3] - k[1]) * rh * .08) + 'px';
    }

    // Fade the photograph in once it has loaded, then begin the drift.
    // (It loads again if turning a phone switches to the other crop.)
    function show() { photo.classList.add('loaded'); stage.classList.add('drift'); placeDoor(); }
    photo.addEventListener('load', show);
    photo.addEventListener('error', show);
    if (photo.complete) show();
    window.addEventListener('resize', placeDoor);

    // The knocker's sound, made here rather than played from a file: three strikes of
    // brass on a wooden door, then the latch. All times are in seconds after "start".
    var RAPS = [0, 0.3, 0.6];
    var LATCH = 0.9;
    function playKnock(ctx, start) {
      var out = ctx.createGain();
      out.gain.value = 0.24;
      out.connect(ctx.destination);

      var noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.25), ctx.sampleRate);
      var samples = noise.getChannelData(0);
      for (var i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;

      function fade(t, amp, length) {       // a sharp start, then a natural decay
        var g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(amp, t + 0.0006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + length);
        g.connect(out);
        return g;
      }
      function tone(t, hz, amp, length, drop) {
        var o = ctx.createOscillator();
        o.frequency.setValueAtTime(hz * (drop || 1), t);
        o.frequency.exponentialRampToValueAtTime(hz, t + 0.014);
        o.connect(fade(t, amp, length));
        o.start(t);
        o.stop(t + length + 0.01);
      }
      function hiss(t, hz, q, amp, length) {
        var s = ctx.createBufferSource(), f = ctx.createBiquadFilter();
        s.buffer = noise;
        f.type = 'bandpass';
        f.frequency.value = hz;
        f.Q.value = q;
        s.connect(f);
        f.connect(fade(t, amp, length));
        s.start(t, 0, length + 0.01);
      }
      function rap(t, force, tune) {
        hiss(t, 3000, 0.7, 0.7 * force, 0.014);          // the instant of contact
        hiss(t, 180, 0.9, 0.7 * force, 0.09);            // the thud into the door
        [[980, 0.12, 0.1], [1560, 0.16, 0.08], [2400, 0.12, 0.06]]
          .forEach(function (p) { tone(t, p[0] * tune, p[1] * force, p[2]); });      // brass: heavy, kept under the wood
        [[62, 0.4, 0.3], [110, 0.42, 0.22], [176, 0.36, 0.15], [290, 0.28, 0.09], [470, 0.14, 0.05]]
          .forEach(function (p) { tone(t, p[0] * tune, p[1] * force, p[2], 1.16); }); // a thick wooden door: low, strong
      }
      [[1, 1], [0.84, 0.985], [0.92, 1.01]].forEach(function (r, n) { rap(start + RAPS[n], r[0], r[1]); });

      hiss(start + LATCH, 2600, 2, 0.16, 0.02);          // the latch lifting, very quietly
      hiss(start + LATCH + 0.055, 3400, 2.5, 0.1, 0.016);
      tone(start + LATCH + 0.055, 210, 0.12, 0.06, 1.1);
    }

    var sound;
    function knockSound() {        // made inside the press, as iPhones insist; silence if it can't be
      try {
        var Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return;
        sound = sound || new Context();
        if (sound.resume) sound.resume();
        playKnock(sound, sound.currentTime + 0.03);
      } catch (e) {}
    }

    // Knock three times, swing the door open, move in through it, and arrive.
    var OPENS = 950, ZOOM_AFTER = 600, ZOOM_TIME = 1350, VEIL_TIME = 450;
    var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var knocking = false, timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

    // Walk in: the world comes toward the eye, through the open door and down the hall.
    function zoomIn() {
      if (calm || !opening) return;
      camera.style.transform = 'translateZ(' + opening.dolly + 'px)';
    }

    var themeColor = document.querySelector('meta[name="theme-color"]');
    function goToMembers() {
      if (MEMBERS_URL) {
        document.body.classList.add('arrived', 'gating');
        later(function () { location.assign(MEMBERS_URL); }, 850);   // once the card has settled
        return;
      }
      soon.textContent = 'Coming soon';
      document.body.classList.add('arrived');
    }

    // Put the door back unseen, behind the solid screen, then let that screen fade away.
    function backToDoor(instant) {
      timers.forEach(clearTimeout);
      timers = [];
      if (instant === true) veil.style.transition = 'none';
      document.body.classList.add('still');
      camera.style.transform = '';
      stage.classList.remove('knocking', 'rap', 'open');
      document.body.classList.remove('entering', 'veiled', 'arrived', 'gating');
      themeColor.content = '#1f282c';
      void camera.offsetWidth;
      document.body.classList.remove('still');
      veil.style.transition = '';
      knocking = false;
    }

    knocker.addEventListener('click', function () {
      if (knocking) return;
      knocking = true;
      soon.textContent = '';
      knockSound();
      stage.classList.add('knocking', 'rap');
      document.body.classList.add('entering');
      later(function () {
        stage.classList.remove('rap');
        void leaf.offsetWidth;          // the raps are over, so the swing starts from a door at rest
        stage.classList.add('open');
      }, OPENS);
      later(zoomIn, OPENS + ZOOM_AFTER);
      later(function () {
        document.body.classList.add('veiled');
        themeColor.content = getComputedStyle(document.documentElement).getPropertyValue('--shell').trim();
      }, OPENS + ZOOM_AFTER + ZOOM_TIME - VEIL_TIME);
      later(goToMembers, OPENS + ZOOM_AFTER + ZOOM_TIME);
    });
    veil.addEventListener('click', function () {
      if (document.body.classList.contains('arrived') && !document.body.classList.contains('gating')) backToDoor();
    });
    window.addEventListener('pageshow', function (e) { if (e.persisted) backToDoor(true); });   // coming back with the Back button

    // Phones have no hover, so the knocker shows off once by itself
    if (matchMedia('(hover: none)').matches) {
      setTimeout(function () { knocker.classList.add('tease'); }, 3500);
      setTimeout(function () { knocker.classList.remove('tease'); }, 4600);
    }

    // Reveal the bar after the first bit of scrolling
    function onScroll() { document.body.classList.toggle('scrolled', window.scrollY > 16); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
