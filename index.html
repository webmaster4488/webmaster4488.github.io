<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Digamma</title>
  <meta name="apple-mobile-web-app-title" content="Digamma">
  <meta name="description" content="44 JFK Street, Cambridge, Massachusetts.">
  <meta name="theme-color" content="#1f282c">
  <script>document.documentElement.classList.add('js')</script>

  <!-- Link previews (iMessage, WhatsApp, Slack, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://44jfk.com/">
  <meta property="og:site_name" content="Digamma">
  <meta property="og:title" content="Digamma">
  <meta property="og:description" content="Cambridge, Massachusetts">
  <meta property="og:image" content="https://44jfk.com/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Century Schoolbook (TeX Gyre Schola, GUST Font License; see fonts/LICENSE.txt) -->
  <link rel="preload" href="fonts/schola-sc.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="preload" as="image" type="image/webp" media="(orientation: landscape)"
        imagesrcset="images/door-1000.webp 1000w, images/door-1600.webp 1600w, images/door-2400.webp 2400w, images/door-3200.webp 3200w"
        imagesizes="(max-aspect-ratio: 7/5) 140vh, 100vw">
  <link rel="preload" as="image" type="image/webp" media="(orientation: portrait)"
        imagesrcset="images/doorway-1200.webp 1200w, images/doorway-1800.webp 1800w, images/doorway-2400.webp 2400w"
        imagesizes="(min-aspect-ratio: 5/7) 100vw, 72vh">

  <style>
    @font-face {
      font-family: "Schola";
      src: url("fonts/schola-sc.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --green: #1f282c;
      --green-deep: #161c1f;
      --gold: #d2a03d;
      --cream: #efe8d6;
      --bar-h: 72px;
    }

    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      margin: 0;
      background: var(--green-deep);
      color: var(--cream);
      font-family: "Schola", "Century Schoolbook", "Century", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- The photograph: the whole screen ---- */
    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: var(--green-deep);
    }
    .stage {
      position: absolute;
      inset: 0;
      transform-origin: 50% 0;     /* the drift keeps the top edge fixed */
    }
    .photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50.4% 0%;   /* never crop the top: trim the bottom only */
    }
    .js .photo { opacity: 0; }
    .js .photo.loaded {
      opacity: 1;
      transition: opacity 1.6s ease;
    }
    /* A slow drift toward the door */
    .stage.drift { animation: drift 40s ease-out both; }
    @keyframes drift {
      from { transform: none; }
      to   { transform: scale(1.03); }
    }

    /* ---- Knocking: the door swings open ----
       The leaf is a copy of the door in the photograph, placed exactly over it by
       script and hidden until the knocker is pressed, so at rest the page is only
       the photograph. Hinges on the left, opening inward. */
    .doorway {
      position: absolute;
      overflow: hidden;
      visibility: hidden;
    }
    .knocking .doorway { visibility: visible; }
    .inside, .leaf { position: absolute; inset: 0; }
    .inside {
      background: radial-gradient(ellipse 75% 45% at 50% 28%, #3a3a2d 0%, var(--green) 58%, #11171a 100%);
    }
    .inside img {
      position: absolute;
      left: 50%;
      width: 40%;
      height: auto;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.7s ease;
    }
    .open .inside img { opacity: 1; transition: opacity 1s ease 0.7s; }
    .leaf {
      background-color: #1a2930;
      background-repeat: no-repeat;
      transform-origin: 0 50%;
      transition: transform 1.7s cubic-bezier(.5, .05, .2, 1);
    }
    .leaf::after {   /* the door falls into shade as it turns away */
      content: "";
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      transition: opacity 1.7s ease;
    }
    .open .leaf { transform: rotateY(84deg); }
    .open .leaf::after { opacity: 0.4; }
    .rap .leaf { animation: rap 0.6s ease-in-out; }
    @keyframes rap {
      0%, 30%, 60%, 100% { transform: none; }
      12%, 42%           { transform: rotateY(0.7deg); }
    }
    .knocker {
      display: none;
      position: absolute;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .js .knocker { display: block; }
    .knocker:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }
    .knocking .knocker { visibility: hidden; }
    @media (hover: hover) {
      .knocker::after {
        content: "";
        position: absolute;
        inset: -35%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 226, 160, 0.2), transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .knocker:hover::after { opacity: 1; }
    }

    /* a fine line at the bottom inviting a scroll */
    .cue {
      position: absolute;
      left: 50%;
      bottom: calc(clamp(18px, 4vh, 36px) + env(safe-area-inset-bottom));
      width: 1px;
      height: 48px;
      overflow: hidden;
      transform: translateX(-50%);
      transition: opacity 0.6s ease;
    }
    .cue::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      transform-origin: top;
      animation: draw 2.6s 2s cubic-bezier(.6, 0, .3, 1) infinite both;
    }
    @keyframes draw {
      0%   { transform: scaleY(0); transform-origin: top; }
      45%  { transform: scaleY(1); transform-origin: top; }
      55%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cue::after { animation: none; transform: none; opacity: 0.6; }
      .stage.drift, .rap .leaf { animation: none; }
      .leaf, .leaf::after, .inside img, .open .inside img { transition: none; }
    }

    /* ---- Bar that appears once you scroll ---- */
    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: var(--bar-h);
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(31, 40, 44, 0.72);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 12px 30px -14px rgba(0, 0, 0, 0.45);
      transform: translateY(calc(-100% - 32px));
      transition: transform 0.7s cubic-bezier(.2, .7, .2, 1);
    }
    .bar a { display: block; padding: 6px; }
    .bar img { display: block; height: 46px; width: auto; }
    @media (max-width: 600px) { :root { --bar-h: 60px; } .bar img { height: 38px; } }
    .scrolled .bar { transform: none; }
    .scrolled .cue { opacity: 0; }

    /* ---- Below the photograph ---- */
    .close {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      background: rgba(31, 40, 44, 0.72);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 -12px 30px -14px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    /* The quote: set like an epigraph. Quote in Century roman,
       attribution in Century small capitals underneath.
       The quotes share one grid cell, so the footer is always as tall as the
       longest one and the page doesn't jump as they rotate. */
    .quotes {
      display: grid;
      width: 100%;
      max-width: 40em;
      align-items: center;
      justify-items: center;
    }
    .quote { grid-area: 1 / 1; margin: 0; max-width: 100%; }
    .js .quote {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0s linear 0.6s;
    }
    .js .quote.on {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.6s ease 0.6s, visibility 0s linear 0.6s;
    }
    .quote blockquote {
      margin: 0;
      font-size: clamp(14px, 1vw, 16px);
      line-height: 1.5;
      letter-spacing: 0.01em;
      color: var(--cream);
      text-wrap: balance;
    }
    /* Lines of verse: set flush left as a centred block, closely spaced, with the
       opening quote mark hung in the margin so the lines start on one edge.
       A line too long for a phone wraps with a hanging indent. */
    .quote blockquote.verse {
      display: inline-block;
      text-align: left;
      line-height: 1.28;
      text-wrap: wrap;
    }
    .verse .line { position: relative; display: block; padding-left: 1em; text-indent: -1em; }
    .verse .oq { position: absolute; right: 100%; text-indent: 0; }
    @media (max-width: 360px) { .quote blockquote { font-size: 13px; } }
    .quote figcaption {
      margin-top: 0.4em;
      font-size: clamp(11px, 0.8vw, 13px);
      font-variant-caps: small-caps;
      font-feature-settings: "smcp", "kern";
      letter-spacing: 0.1em;
      line-height: 1.5;
      color: var(--gold);
    }

    /* ---- Phones and tall screens ----
       A full-height crop of the doorway (transom, frame and door), centred on the
       door, fills the screen. Narrower screens lose only the sides; nothing is
       cropped from the top. The crest bar and quote appear on scroll. */
    @media (orientation: portrait) {
      .photo { object-position: 50% 0%; }
    }
  </style>
</head>
<body>

  <header class="bar">
    <a href="#top" aria-label="Back to top">
      <picture>
        <source type="image/webp" srcset="images/crest.webp">
        <img src="images/crest.png" width="575" height="720" alt="Crest">
      </picture>
    </a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="stage" id="stage">
        <picture>
          <!-- Phones and other tall screens: the whole doorway, centred on the door -->
          <source media="(orientation: portrait)" type="image/webp"
                  srcset="images/doorway-1200.webp 1200w, images/doorway-1800.webp 1800w, images/doorway-2400.webp 2400w"
                  sizes="(min-aspect-ratio: 5/7) 100vw, 72vh">
          <source media="(orientation: portrait)"
                  srcset="images/doorway-1200.jpg 1200w, images/doorway-1800.jpg 1800w, images/doorway-2400.jpg 2400w"
                  sizes="(min-aspect-ratio: 5/7) 100vw, 72vh">
          <source type="image/webp"
                  srcset="images/door-1000.webp 1000w, images/door-1600.webp 1600w, images/door-2400.webp 2400w, images/door-3200.webp 3200w"
                  sizes="(max-aspect-ratio: 7/5) 140vh, 100vw">
          <img class="photo" src="images/door-2400.jpg"
               srcset="images/door-1000.jpg 1000w, images/door-1600.jpg 1600w, images/door-2400.jpg 2400w, images/door-3200.jpg 3200w"
               sizes="(max-aspect-ratio: 7/5) 140vh, 100vw"
               width="4691" height="3351"
               alt="The green front door of 44 JFK Street, with a bronze knocker and brass numerals, framed by white columns.">
        </picture>
        <div class="doorway" id="doorway" aria-hidden="true">
          <div class="inside"><img src="images/crest.webp" alt=""></div>
          <div class="leaf" id="leaf"></div>
        </div>
        <button type="button" class="knocker" id="knocker" aria-label="Knock"></button>
      </div>
      <span class="cue" aria-hidden="true"></span>
    </section>

    <footer class="close">
      <div class="quotes" id="quotes">
        <figure class="quote on">
          <blockquote>“Without these friendships—life, what cauchemar!”</blockquote>
          <figcaption>T. S. Eliot ‘10</figcaption>
        </figure>
      </div>
    </footer>
  </main>

  <script>
    // Quotes from members only, changing every 7 seconds.
    // To add one, copy a line and change the text and name ("\n" starts a new line).
    // Eliot: "Portrait of a Lady" (1917) and a Ballade (1909).
    // Hagedorn: "A Troop of the Guard", Harvard Class Poem (1907), and "Fighters" (1909).
    var QUOTES = [
      { text: "Without these friendships—life, what cauchemar!", by: "T. S. Eliot ‘10" },
      { text: "To find a friend who has these qualities,\nWho has, and gives\nThose qualities upon which friendship lives.", by: "T. S. Eliot ‘10" },
      { text: "I shall sit here, serving tea to friends.", by: "T. S. Eliot ‘10" },
      { text: "Your genial influence awaits", by: "T. S. Eliot ‘10" },
      { text: "Into the dawn, we ride, we ride,\nFellow and fellow, side by side", by: "Hermann Hagedorn ‘07" },
      { text: "Friends of the great, the high, the perilous years,\nUpon the brink of mighty things we stand", by: "Hermann Hagedorn ‘07" },
      { text: "Fearless, to rise or fall,\nArm pressed to arm we stand", by: "Hermann Hagedorn ‘07" }
    ];
    var quoteFigures = QUOTES.map(function (q) {
      var lines = q.text.split("\n");
      var fig = document.createElement("figure");
      var text = document.createElement("blockquote");
      var by = document.createElement("figcaption");
      fig.className = "quote";
      if (lines.length > 1) text.className = "verse";
      lines.forEach(function (line, n) {
        var span = document.createElement("span");
        span.className = "line";
        if (n === 0) {
          var oq = document.createElement("span");
          oq.className = "oq";
          oq.textContent = "“";
          span.appendChild(oq);
        }
        span.appendChild(document.createTextNode(line + (n === lines.length - 1 ? "”" : "")));
        text.appendChild(span);
      });
      by.textContent = q.by;
      fig.appendChild(text);
      fig.appendChild(by);
      return fig;
    });
    var quoteShowing = null;
    function showQuote(i) {
      if (quoteShowing) quoteShowing.classList.remove("on");
      quoteShowing = quoteFigures[i];
      quoteShowing.classList.add("on");
    }
    (function () {
      var box = document.getElementById("quotes");
      box.textContent = "";
      quoteFigures.forEach(function (fig) { box.appendChild(fig); });

      // Shuffled, so every quote appears once before any repeats
      var order = QUOTES.map(function (q, i) { return i; });
      for (var n = order.length - 1; n > 0; n--) {
        var r = Math.floor(Math.random() * (n + 1));
        var swap = order[n]; order[n] = order[r]; order[r] = swap;
      }
      try { // don't open with the quote that opened the last visit
        if (order[0] === parseInt(localStorage.getItem("quote"), 10)) order.push(order.shift());
        localStorage.setItem("quote", String(order[0]));
      } catch (e) {}
      showQuote(order[0]);

      // Change only while the quote is on screen, so the first one seen gets its full
      // time, and hold it while the pointer rests on it.
      var at = 0, timer, onScreen = false;
      function run(on) {
        clearInterval(timer);
        if (on) timer = setInterval(function () {
          at = (at + 1) % order.length;
          showQuote(order[at]);
        }, 7000);
      }
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        new IntersectionObserver(function (entries) {
          onScreen = entries[entries.length - 1].isIntersecting;
          run(onScreen);
        }).observe(box);
        box.addEventListener("mouseenter", function () { run(false); });
        box.addEventListener("mouseleave", function () { run(onScreen); });
      }
    })();
  </script>

  <script>
    // When the members area is ready, put its address here and a knock will lead to it:
    // var MEMBERS_URL = "https://members.44jfk.com/";
    var MEMBERS_URL = "";

    var stage = document.getElementById('stage');
    var photo = stage.querySelector('.photo');
    var doorway = document.getElementById('doorway');
    var leaf = document.getElementById('leaf');
    var knocker = document.getElementById('knocker');

    // Where the door's corners and the knocker sit in each photograph,
    // as fractions of its width and height.
    var DOORS = {
      landscape: { tl: [.3150, .2150], tr: [.6927, .2125], br: [.6933, 1], bl: [.3165, 1], knocker: [.483, .31, .529, .422] },
      portrait:  { tl: [.1296, .2150], tr: [.8677, .2122], br: [.8692, 1], bl: [.1328, 1], knocker: [.455, .31, .548, .422] }
    };

    // Lay the door and knocker over the photograph as it is cropped on this screen
    function placeDoor() {
      var iw = photo.naturalWidth, ih = photo.naturalHeight;
      if (!iw) return;
      var W = stage.offsetWidth, H = stage.offsetHeight;
      var door = ih > iw ? DOORS.portrait : DOORS.landscape;
      var scale = Math.max(W / iw, H / ih), rw = iw * scale, rh = ih * scale;
      var ox = (W - rw) * parseFloat(getComputedStyle(photo).objectPosition) / 100;
      var left = door.tl[0] * rw, top = door.tr[1] * rh;
      var width = door.br[0] * rw - left;
      var height = rh * 1.5 - top;              // runs past the photo so the swinging edge never shows a gap
      var seen = Math.min(H, rh) - top;

      function corner(p, y) { return (p[0] * rw - left) + 'px ' + (y === undefined ? p[1] * rh - top : y) + 'px'; }
      doorway.style.left = ox + left + 'px';
      doorway.style.top = top + 'px';
      doorway.style.width = width + 'px';
      doorway.style.height = height + 'px';
      doorway.style.perspective = width * 2.2 + 'px';
      doorway.style.perspectiveOrigin = '50% ' + seen * 0.45 + 'px';
      doorway.style.clipPath = 'polygon(' + [corner(door.tl), corner(door.tr), corner(door.br, height), corner(door.bl, height)].join(',') + ')';

      leaf.style.backgroundImage = 'url("' + photo.currentSrc + '")';
      leaf.style.backgroundSize = rw + 'px ' + rh + 'px';
      leaf.style.backgroundPosition = -left + 'px ' + -top + 'px';
      doorway.querySelector('img').style.top = seen * 0.44 + 'px';

      var k = door.knocker;
      knocker.style.left = ox + k[0] * rw + 'px';
      knocker.style.top = k[1] * rh + 'px';
      knocker.style.width = (k[2] - k[0]) * rw + 'px';
      knocker.style.height = (k[3] - k[1]) * rh + 'px';
    }

    // Fade the photograph in once it has loaded, then begin the drift.
    // (It loads again if turning a phone switches to the other crop.)
    function show() { photo.classList.add('loaded'); stage.classList.add('drift'); placeDoor(); }
    photo.addEventListener('load', show);
    photo.addEventListener('error', show);
    if (photo.complete) show();
    window.addEventListener('resize', placeDoor);

    // Knock twice, swing the door open, then go in (or close again)
    var knocking = false;
    function shut() { stage.classList.remove('knocking', 'rap', 'open'); knocking = false; }
    knocker.addEventListener('click', function () {
      if (knocking) return;
      knocking = true;
      stage.classList.add('knocking', 'rap');
      setTimeout(function () { stage.classList.remove('rap'); stage.classList.add('open'); }, 650);
      if (MEMBERS_URL) {
        setTimeout(function () { location.href = MEMBERS_URL; }, 2900);
      } else {
        setTimeout(function () { stage.classList.remove('open'); }, 4800);
        setTimeout(shut, 6600);
      }
    });
    window.addEventListener('pageshow', function (e) { if (e.persisted) shut(); });   // coming back with the Back button

    // Reveal the bar after the first bit of scrolling
    function onScroll() { document.body.classList.toggle('scrolled', window.scrollY > 16); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
