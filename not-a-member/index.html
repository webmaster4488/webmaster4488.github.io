<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Digamma</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { --shell: #f3ecdd; --ink: #234030; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --shell: #161c1f; --ink: #f3ecdd; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--shell); }
  body { display: grid; place-items: center; padding: 24px 16px; font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
  .frame { position: relative; width: min(360px, calc(100vw - 40px)); aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 1px rgba(12, 22, 17, .3), 0 18px 36px -18px rgba(12, 22, 17, .6); background: #14261e; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.1s ease; }
  .frame img.on { opacity: 1; }
  a { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 20px; color: inherit; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { .frame img { transition: none; } }
</style>
</head>
<body>
<a href="/">Back</a>
<div class="frame" id="frame"></div>
<script>
  // The photographs for the time of year: autumn from September, winter from December.
  var FILES = ["any-1.jpg", "fall-1.jpg", "fall-2.jpg", "fall-3.jpg", "fall-4.jpg", "fall-5.jpg", "spring-1.jpg", "winter-1.jpg", "winter-2.jpg", "winter-3.jpg", "winter-4.jpg", "winter-5.jpg", "winter-6.jpg", "winter-7.jpg"];
  var m = new Date().getMonth();
  var season = m >= 8 && m <= 10 ? "fall" : (m === 11 || m <= 1) ? "winter" : m <= 3 ? "spring" : "";
  var set = FILES.filter(function (f) { return !season || f.indexOf(season) === 0 || f.indexOf("any") === 0; });
  var frame = document.getElementById("frame");
  var imgs = set.map(function (f, i) {
    var el = new Image();
    el.alt = "";
    el.src = "photos/" + f;
    if (!i) el.className = "on";
    frame.appendChild(el);
    return el;
  });
  var at = 0;
  function next() {
    imgs[at].className = "";
    at = (at + 1) % imgs.length;
    imgs[at].className = "on";
  }
  if (imgs.length > 1) setInterval(next, 4200);
  frame.addEventListener("click", next);
</script>
</body>
</html>
